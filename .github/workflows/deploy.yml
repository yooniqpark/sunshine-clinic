name: Deploy to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm install (not ci) — Next.js 16 has loose @swc/helpers constraint
        # that our locally-pinned lock doesn't perfectly satisfy under newer npm.
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create empty DB for static build
        # Some pages prerender via getStaticParams + DB reads. Give Prisma an
        # empty DB so queries return [] instead of throwing during build.
        run: |
          mkdir -p prisma
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          # Build-time placeholders — runtime values live on the server's .env
          DATABASE_URL: file:./prisma/dev.db
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'build-time-placeholder' }}
          AUTH_TRUST_HOST: 'true'

      - name: Package release
        run: |
          mkdir -p release/.next
          cp -R .next/standalone/. release/
          cp -R .next/static release/.next/static
          cp -R public release/public
          mkdir -p release/prisma
          cp prisma/schema.prisma release/prisma/schema.prisma
          cp prisma/manual-sections.json release/prisma/manual-sections.json
          mkdir -p release/scripts
          cp scripts/migrate-content.mjs release/scripts/ || true
          cp scripts/seed-manual.mjs release/scripts/
          # ensure schema/scripts overrides happen after rsync of standalone
          tar -czf release.tar.gz -C release .
          ls -lh release.tar.gz

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            release.tar.gz \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/tmp/release.tar.gz

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~

          # 1) extract into staging dir
          rm -rf release
          mkdir release
          tar -xzf /tmp/release.tar.gz -C release
          rm -f /tmp/release.tar.gz

          # 2) swap server.js + .next + public (keep .env, node_modules, prisma/dev.db)
          cp -f release/server.js ~/app/server.js
          # 실행 중인 앱이 ISR 캐시를 쓰는 동안 rm이 레이스로 실패할 수 있어 재시도
          rm -rf ~/app/.next || { sleep 3; rm -rf ~/app/.next; }
          mkdir -p ~/app/.next
          cp -R release/.next/* ~/app/.next/
          rm -rf ~/app/public
          cp -R release/public ~/app/public

          # 3) sync prisma schema + scripts (no db destructive)
          cp -f release/prisma/schema.prisma ~/app/prisma/schema.prisma
          cp -f release/prisma/manual-sections.json ~/app/prisma/manual-sections.json
          mkdir -p ~/app/scripts
          cp -f release/scripts/migrate-content.mjs ~/app/scripts/migrate-content.mjs 2>/dev/null || true
          cp -f release/scripts/seed-manual.mjs ~/app/scripts/seed-manual.mjs

          # 4) prisma db push (only adds missing tables/columns; never drops)
          cd ~/app
          ./node_modules/.bin/prisma generate --schema=./prisma/schema.prisma
          ./node_modules/.bin/prisma db push --schema=./prisma/schema.prisma --skip-generate

          # 4.5) 챗봇 매뉴얼 최신화 (제목 기준 upsert)
          node scripts/seed-manual.mjs

          # 5) 챗봇(Qwen) 런타임 env 동기화 — 기존 값을 지우고 최신으로 유지
          touch ~/app/.env
          sed -i '/^QWEN_API_KEY=/d;/^QWEN_MODEL=/d' ~/app/.env
          echo 'QWEN_API_KEY=sk-ws-H.DMMMMHH.k3lb.MEUCIQCTUloJaaxHwYxYmUIR_tehUcuuhDM8nBMyEqM5nvHoPwIgF9jQA7XHBd1VhbgjeGO880X4NzA4019jKEZV_WLTDOQ' >> ~/app/.env
          echo 'QWEN_MODEL=qwen3.7-plus' >> ~/app/.env

          # 6) restart
          pm2 restart clinic
          sleep 2
          pm2 status

          # 6.5) 챗봇 스모크 테스트 — Qwen 연동 + 오프토픽 차단 확인 (실패해도 배포는 유지)
          sleep 5
          echo "--- chatbot smoke test: 병원 위치 ---"
          curl -s -X POST http://localhost:3000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"병원 위치가 어디인가요?","locale":"ko"}' \
            --max-time 60 || true
          echo
          echo "--- chatbot smoke test: 오프토픽 ---"
          curl -s -X POST http://localhost:3000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"비트코인 시세 전망 알려줘","locale":"ko"}' \
            --max-time 60 || true
          echo

          # 7) cleanup
          rm -rf ~/release
          REMOTE

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sSL -m 15 -o /dev/null -w "%{http_code}" https://mysunshineclinic.com/)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 3
          done
          echo "Site did not respond with 200 — check pm2 logs"
          exit 1
