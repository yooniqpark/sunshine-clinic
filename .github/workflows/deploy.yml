name: Deploy to Lightsail

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to release this ref to production"
        required: true
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      # @yooniqpark/clinic-core (GitHub Packages) 설치용
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm install (not ci) — Next.js 16 has loose @swc/helpers constraint
        # that our locally-pinned lock doesn't perfectly satisfy under newer npm.
        # postinstall 의 clinic-core sync 가 prisma/core.prisma 를 만든다
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify package and locale content
        run: |
          test "$(node -p "require('./node_modules/@yooniqpark/clinic-core/package.json').version")" = "0.2.3"
          npm run locale:check

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create empty DB for static build
        # Some pages prerender via getStaticParams + DB reads. Give Prisma an
        # empty DB so queries return [] instead of throwing during build.
        run: |
          mkdir -p prisma
          touch prisma/dev.db
          node scripts/deploy-migrations.mjs
        env:
          DATABASE_URL: file:./dev.db

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          # Build-time placeholders — runtime values live on the server's .env
          DATABASE_URL: file:./dev.db
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'build-time-placeholder' }}
          AUTH_TRUST_HOST: 'true'

      - name: Package release
        run: |
          mkdir -p release/.next
          cp -R .next/standalone/. release/
          # Next standalone tracing can omit Sharp's platform-specific optional
          # packages when the module is loaded lazily by the upload adapter.
          # Ship the Linux packages installed on this Actions runner explicitly.
          rm -rf release/node_modules/sharp release/node_modules/@img
          cp -R node_modules/sharp release/node_modules/sharp
          cp -R node_modules/@img release/node_modules/@img
          test -d release/node_modules/@img/sharp-linux-x64
          test -d release/node_modules/@img/sharp-libvips-linux-x64
          cp -R .next/static release/.next/static
          cp -R public release/public
          cp -R content release/content
          cp -R messages release/messages
          mkdir -p release/prisma
          # 스키마는 prisma/*.prisma 여러 파일 (core.prisma + main/sunshine.prisma)
          cp prisma/*.prisma release/prisma/
          cp -R prisma/migrations release/prisma/migrations
          cp prisma/manual-sections.json release/prisma/manual-sections.json
          mkdir -p release/scripts
          cp scripts/deploy-migrations.mjs release/scripts/
          cp scripts/migrate-content.mjs release/scripts/ || true
          cp scripts/seed-manual.mjs release/scripts/
          cp scripts/seed-current-events.mjs release/scripts/
          cp prisma/current-events.json release/prisma/current-events.json
          rm -f release/prisma/dev.db
          # 과거 macOS 복사 과정에서 생긴 AppleDouble 파일은 Prisma가
          # 스키마로 오인하므로 릴리스에 포함하지 않는다.
          find release -type f -name '._*' -delete
          # ensure schema/scripts overrides happen after rsync of standalone
          tar -czf release.tar.gz -C release .
          ls -lh release.tar.gz

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            release.tar.gz \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/tmp/release.tar.gz

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~
          upload_root="$PWD/app-data/uploads"
          release_id='${{ github.sha }}'

          # 0) preserve the current database before the first migration-based deploy
          if [ -f ~/app/prisma/dev.db ]; then
            backup_stamp=$(date +%Y%m%d-%H%M%S)
            cp -p ~/app/prisma/dev.db ~/app/prisma/dev.db.backup-"$backup_stamp"
          fi

          # 1) extract into staging dir
          rm -rf release
          mkdir release
          tar -xzf /tmp/release.tar.gz -C release
          rm -f /tmp/release.tar.gz

          # 2) 관리자 업로드는 불변 릴리스 밖에 보존한다.
          #    기존 public/uploads가 있으면 최초 1회 승계한다.
          mkdir -p "$upload_root"
          if [ -d ~/app/public/uploads ] && [ ! -L ~/app/public/uploads ]; then
            cp -a ~/app/public/uploads/. "$upload_root"/
          fi

          # 3) sync prisma schema + scripts (no db destructive)
          #    예전 단일 schema.prisma 가 남아 있으면 모델이 중복되므로 지우고 새 파일로 교체.
          #    dev.db 는 ~/app/prisma/ 에 그대로 둔다 (file:./dev.db 가 이 폴더 기준).
          rm -f ~/app/prisma/*.prisma
          find ~/app/prisma -maxdepth 1 -type f -name '._*.prisma' -delete
          cp -f release/prisma/*.prisma ~/app/prisma/
          rm -rf ~/app/prisma/migrations
          cp -R release/prisma/migrations ~/app/prisma/migrations
          cp -f release/prisma/manual-sections.json ~/app/prisma/manual-sections.json
          cp -f release/prisma/current-events.json ~/app/prisma/current-events.json
          rm -rf ~/app/content ~/app/messages
          cp -R release/content ~/app/content
          cp -R release/messages ~/app/messages
          mkdir -p ~/app/scripts
          cp -f release/scripts/deploy-migrations.mjs ~/app/scripts/deploy-migrations.mjs
          cp -f release/scripts/migrate-content.mjs ~/app/scripts/migrate-content.mjs 2>/dev/null || true
          cp -f release/scripts/seed-manual.mjs ~/app/scripts/seed-manual.mjs
          cp -f release/scripts/seed-current-events.mjs ~/app/scripts/seed-current-events.mjs

          # SQLite URL is absolute so immutable runtime directories and Prisma
          # migration scripts always open the same clinic-owned database.
          mkdir -p ~/app/prisma
          touch ~/app/prisma/dev.db ~/app/.env
          database_path="$HOME/app/prisma/dev.db"
          sed -i '/^DATABASE_URL=/d' ~/app/.env
          echo "DATABASE_URL=file:$database_path" >> ~/app/.env
          test -r "$database_path"
          test -w "$database_path"

          # 4) checked-in migrations apply (consumer owns migration history)
          cd ~/app
          ./node_modules/.bin/prisma generate --schema=./prisma
          node scripts/deploy-migrations.mjs

          # 4.5) 챗봇 매뉴얼 — 새 섹션만 추가 (관리자 수정분 보존)
          node scripts/seed-manual.mjs

          # 4.6) 기존 코드 고정 이벤트를 관리자 편집 데이터로 최초 1회 승계
          #      같은 slug가 이미 있으면 관리자 수정값을 절대 덮어쓰지 않는다.
          node scripts/seed-current-events.mjs

          # 4.7) 공개 페이지 콘텐츠 — 없는 행만 최초 생성
          #      관리자에서 수정한 기존 값은 migrate-content가 덮어쓰지 않는다.
          node scripts/migrate-content.mjs

          # 5) 챗봇(Qwen) 키 — GitHub Secrets 에 QWEN_API_KEY 가 있을 때만 갱신
          sed -i '/^CLINIC_UPLOAD_DIR=/d;/^CLINIC_UPLOAD_PUBLIC_PREFIX=/d' ~/app/.env
          echo "CLINIC_UPLOAD_DIR=$upload_root" >> ~/app/.env
          echo 'CLINIC_UPLOAD_PUBLIC_PREFIX=/uploads' >> ~/app/.env
          QWEN_KEY='${{ secrets.QWEN_API_KEY }}'
          if [ -n "$QWEN_KEY" ]; then
            sed -i '/^QWEN_API_KEY=/d' ~/app/.env
            echo "QWEN_API_KEY=$QWEN_KEY" >> ~/app/.env
          fi
          grep -q '^QWEN_MODEL=' ~/app/.env || echo 'QWEN_MODEL=qwen3.6-flash' >> ~/app/.env

          # 5.5) 관리자 글쓰기 도우미(Claude) 키 — GitHub Secrets 에 ANTHROPIC_API_KEY 가 있을 때만 갱신
          ANTHROPIC_KEY='${{ secrets.ANTHROPIC_API_KEY }}'
          if [ -n "$ANTHROPIC_KEY" ]; then
            sed -i '/^ANTHROPIC_API_KEY=/d' ~/app/.env
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_KEY" >> ~/app/.env
          fi

          # 5.6) Core 관리자 번역 키 — secret이 없으면 서버의 기존 값 보존
          OPENAI_KEY='${{ secrets.OPENAI_API_KEY }}'
          if [ -n "$OPENAI_KEY" ]; then
            sed -i '/^OPENAI_API_KEY=/d' ~/app/.env
            echo "OPENAI_API_KEY=$OPENAI_KEY" >> ~/app/.env
          fi

          # 6) standalone 전체를 버전별 불변 릴리스로 승격한다.
          #    server.js와 node_modules를 같은 빌드에서 사용해야 프레임워크 업그레이드가 안전하다.
          mkdir -p ~/app/releases
          runtime_dir="$HOME/app/releases/$release_id"
          rm -rf "$runtime_dir"
          mv ~/release "$runtime_dir"
          ln -sfn ~/app/.env "$runtime_dir/.env"
          rm -f "$runtime_dir/prisma/dev.db"
          ln -s ~/app/prisma/dev.db "$runtime_dir/prisma/dev.db"
          rm -rf "$runtime_dir/public/uploads"
          ln -s "$upload_root" "$runtime_dir/public/uploads"

          previous_runtime=""
          if [ -L ~/app/runtime-current ]; then
            previous_runtime=$(readlink -f ~/app/runtime-current)
          fi
          ln -sfn "$runtime_dir" ~/app/runtime-current

          pm2 delete clinic || true
          cd "$runtime_dir"
          pm2 start server.js --name clinic --update-env
          pm2 save
          sleep 5

          # 내부 스모크 테스트가 실패하면 직전 불변 릴리스로 자동 복구한다.
          if ! curl -fsS --max-time 15 \
            -H 'Host: mysunshineclinic.com' \
            -H 'x-forwarded-proto: https' \
            http://localhost:3000/en/home >/dev/null; then
            pm2 logs clinic --lines 120 --nostream || true
            if [ -n "$previous_runtime" ] && [ -f "$previous_runtime/server.js" ]; then
              ln -sfn "$previous_runtime" ~/app/runtime-current
              pm2 delete clinic || true
              cd "$previous_runtime"
              pm2 start server.js --name clinic --update-env
              pm2 save
            fi
            exit 1
          fi
          pm2 status

          # 6.5) 챗봇 스모크 테스트 — Qwen 연동 + 오프토픽 차단 확인 (실패해도 배포는 유지)
          sleep 5
          echo "--- chatbot smoke test: 인사 ---"
          curl -s -X POST http://localhost:3000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"안녕하세요!","locale":"ko"}' \
            --max-time 60 || true
          echo
          echo "--- chatbot smoke test: 병원 위치 ---"
          curl -s -X POST http://localhost:3000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"병원 위치가 어디인가요?","locale":"ko"}' \
            --max-time 60 || true
          echo
          echo "--- chatbot smoke test: 실장 상담+예약 의사 (booking:true 기대) ---"
          curl -s -X POST http://localhost:3000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"네, 그 내용으로 예약하고 싶어요","locale":"ko","history":[{"role":"user","text":"볼에 여드름 자국이 심해서 고민이에요"},{"role":"bot","text":"오래 신경 쓰이셨겠어요. 언제부터 자국이 남기 시작하셨나요?"},{"role":"user","text":"2년쯤 됐어요"},{"role":"bot","text":"말씀 감사해요. 지금까지 상담해 주신 내용으로 예약을 도와드릴까요?"}]}' \
            --max-time 60 || true
          echo
          echo "--- chatbot smoke test: 오프토픽 ---"
          curl -s -X POST http://localhost:3000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"비트코인 시세 전망 알려줘","locale":"ko"}' \
            --max-time 60 || true
          echo

          # 7) 최근 릴리스 3개만 유지한다. 현재/직전 릴리스는 삭제하지 않는다.
          cd ~/app/releases
          ls -1dt */ 2>/dev/null | tail -n +4 | xargs -r rm -rf
          REMOTE

      - name: Smoke test
        run: |
          site_url="${{ vars.SITE_URL || 'https://mysunshineclinic.com' }}"
          for path in / /en /ja /zh; do
            ok=false
            for i in 1 2 3 4 5; do
              code=$(curl -sSL -m 15 -o /dev/null -w "%{http_code}" "$site_url$path")
              echo "$path attempt $i: HTTP $code"
              if [ "$code" = "200" ]; then ok=true; break; fi
              sleep 3
            done
            if [ "$ok" != true ]; then
              echo "$path did not respond with 200 — check pm2 logs"
              exit 1
            fi
          done
