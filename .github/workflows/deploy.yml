name: Deploy to Lightsail

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to release this ref to production"
        required: true
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      # @yooniqpark/clinic-core (GitHub Packages) 설치용
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm install (not ci) — Next.js 16 has loose @swc/helpers constraint
        # that our locally-pinned lock doesn't perfectly satisfy under newer npm.
        # postinstall 의 clinic-core sync 가 prisma/core.prisma 를 만든다
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify package and locale content
        run: |
          test "$(node -p "require('./node_modules/@yooniqpark/clinic-core/package.json').version")" = "0.2.0"
          npm run locale:check

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create empty DB for static build
        # Some pages prerender via getStaticParams + DB reads. Give Prisma an
        # empty DB so queries return [] instead of throwing during build.
        run: |
          mkdir -p prisma
          touch prisma/dev.db
          node scripts/deploy-migrations.mjs
        env:
          DATABASE_URL: file:./dev.db

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          # Build-time placeholders — runtime values live on the server's .env
          DATABASE_URL: file:./dev.db
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'build-time-placeholder' }}
          AUTH_TRUST_HOST: 'true'

      - name: Package release
        run: |
          mkdir -p release/.next
          cp -R .next/standalone/. release/
          cp -R .next/static release/.next/static
          cp -R public release/public
          mkdir -p release/prisma
          # 스키마는 prisma/*.prisma 여러 파일 (core.prisma + main/sunshine.prisma)
          cp prisma/*.prisma release/prisma/
          cp -R prisma/migrations release/prisma/migrations
          cp prisma/manual-sections.json release/prisma/manual-sections.json
          mkdir -p release/scripts
          cp scripts/deploy-migrations.mjs release/scripts/
          cp scripts/migrate-content.mjs release/scripts/ || true
          cp scripts/seed-manual.mjs release/scripts/
          # ensure schema/scripts overrides happen after rsync of standalone
          tar -czf release.tar.gz -C release .
          ls -lh release.tar.gz

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            release.tar.gz \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/tmp/release.tar.gz

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~

          # 0) preserve the current database before the first migration-based deploy
          if [ -f ~/app/prisma/dev.db ]; then
            backup_stamp=$(date +%Y%m%d-%H%M%S)
            cp -p ~/app/prisma/dev.db ~/app/prisma/dev.db.backup-"$backup_stamp"
          fi

          # 1) extract into staging dir
          rm -rf release
          mkdir release
          tar -xzf /tmp/release.tar.gz -C release
          rm -f /tmp/release.tar.gz

          # 2) swap server.js + .next + public (keep .env, node_modules, prisma/dev.db)
          cp -f release/server.js ~/app/server.js
          # 실행 중인 앱이 ISR 캐시를 쓰는 동안 rm이 레이스로 실패할 수 있어 재시도
          rm -rf ~/app/.next || { sleep 3; rm -rf ~/app/.next; }
          mkdir -p ~/app/.next
          cp -R release/.next/* ~/app/.next/
          rm -rf ~/app/public
          cp -R release/public ~/app/public

          # 3) sync prisma schema + scripts (no db destructive)
          #    예전 단일 schema.prisma 가 남아 있으면 모델이 중복되므로 지우고 새 파일로 교체.
          #    dev.db 는 ~/app/prisma/ 에 그대로 둔다 (file:./dev.db 가 이 폴더 기준).
          rm -f ~/app/prisma/*.prisma
          cp -f release/prisma/*.prisma ~/app/prisma/
          rm -rf ~/app/prisma/migrations
          cp -R release/prisma/migrations ~/app/prisma/migrations
          cp -f release/prisma/manual-sections.json ~/app/prisma/manual-sections.json
          mkdir -p ~/app/scripts
          cp -f release/scripts/deploy-migrations.mjs ~/app/scripts/deploy-migrations.mjs
          cp -f release/scripts/migrate-content.mjs ~/app/scripts/migrate-content.mjs 2>/dev/null || true
          cp -f release/scripts/seed-manual.mjs ~/app/scripts/seed-manual.mjs

          # 4) checked-in migrations apply (consumer owns migration history)
          cd ~/app
          ./node_modules/.bin/prisma generate --schema=./prisma
          node scripts/deploy-migrations.mjs

          # 4.5) 챗봇 매뉴얼 — 새 섹션만 추가 (관리자 수정분 보존)
          node scripts/seed-manual.mjs

          # 5) 챗봇(Qwen) 키 — GitHub Secrets 에 QWEN_API_KEY 가 있을 때만 갱신
          touch ~/app/.env
          QWEN_KEY='${{ secrets.QWEN_API_KEY }}'
          if [ -n "$QWEN_KEY" ]; then
            sed -i '/^QWEN_API_KEY=/d' ~/app/.env
            echo "QWEN_API_KEY=$QWEN_KEY" >> ~/app/.env
          fi
          grep -q '^QWEN_MODEL=' ~/app/.env || echo 'QWEN_MODEL=qwen3.6-flash' >> ~/app/.env

          # 5.5) 관리자 글쓰기 도우미(Claude) 키 — GitHub Secrets 에 ANTHROPIC_API_KEY 가 있을 때만 갱신
          ANTHROPIC_KEY='${{ secrets.ANTHROPIC_API_KEY }}'
          if [ -n "$ANTHROPIC_KEY" ]; then
            sed -i '/^ANTHROPIC_API_KEY=/d' ~/app/.env
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_KEY" >> ~/app/.env
          fi

          # 5.6) Core 관리자 번역 키 — secret이 없으면 서버의 기존 값 보존
          OPENAI_KEY='${{ secrets.OPENAI_API_KEY }}'
          if [ -n "$OPENAI_KEY" ]; then
            sed -i '/^OPENAI_API_KEY=/d' ~/app/.env
            echo "OPENAI_API_KEY=$OPENAI_KEY" >> ~/app/.env
          fi

          # 6) restart
          pm2 restart clinic
          sleep 2
          pm2 status

          # 6.5) 챗봇 스모크 테스트 — Qwen 연동 + 오프토픽 차단 확인 (실패해도 배포는 유지)
          sleep 5
          echo "--- chatbot smoke test: 인사 ---"
          curl -s -X POST http://localhost:3000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"안녕하세요!","locale":"ko"}' \
            --max-time 60 || true
          echo
          echo "--- chatbot smoke test: 병원 위치 ---"
          curl -s -X POST http://localhost:3000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"병원 위치가 어디인가요?","locale":"ko"}' \
            --max-time 60 || true
          echo
          echo "--- chatbot smoke test: 실장 상담+예약 의사 (booking:true 기대) ---"
          curl -s -X POST http://localhost:3000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"네, 그 내용으로 예약하고 싶어요","locale":"ko","history":[{"role":"user","text":"볼에 여드름 자국이 심해서 고민이에요"},{"role":"bot","text":"오래 신경 쓰이셨겠어요. 언제부터 자국이 남기 시작하셨나요?"},{"role":"user","text":"2년쯤 됐어요"},{"role":"bot","text":"말씀 감사해요. 지금까지 상담해 주신 내용으로 예약을 도와드릴까요?"}]}' \
            --max-time 60 || true
          echo
          echo "--- chatbot smoke test: 오프토픽 ---"
          curl -s -X POST http://localhost:3000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"비트코인 시세 전망 알려줘","locale":"ko"}' \
            --max-time 60 || true
          echo

          # 7) cleanup
          rm -rf ~/release
          REMOTE

      - name: Smoke test
        run: |
          site_url="${{ vars.SITE_URL || 'https://mysunshineclinic.com' }}"
          for path in / /en /ja /zh; do
            ok=false
            for i in 1 2 3 4 5; do
              code=$(curl -sSL -m 15 -o /dev/null -w "%{http_code}" "$site_url$path")
              echo "$path attempt $i: HTTP $code"
              if [ "$code" = "200" ]; then ok=true; break; fi
              sleep 3
            done
            if [ "$ok" != true ]; then
              echo "$path did not respond with 200 — check pm2 logs"
              exit 1
            fi
          done
